# CENT — tiny configuration used by the smoke test (no training)
name: cent_tiny

data:
  root: datasets
  unipen_dir: datasets/SCUT-COUCH2009/Textline_NU
  word_dir: datasets/SCUT-COUCH2009/WORD8888
  max_points: 2000
  min_chars: 2

vocab:
  min_count: 1

model:
  n_chars: 512
  n_writers: 32
  d: 128
  z_dim: 64
  vae_d: 128
  stride: 8
  dit_depth: 3
  dit_heads: 4
  n_mix: 20
  n_steps: 1000

loss:
  w_gmm: 1.0
  w_pen: 2.0
  w_kl: 0.001
  w_ctc: 1.0
  w_style: 0.5
  w_diff: 1.0
  w_bnd: 1.0
  bnd_pos_weight: 4.0

train:
  batch_size: 8
  lr: 0.0002
  epochs: 100
  grad_clip: 1.0
  device: cuda

eval:
  ddim_steps: 20
  controls: [0.0, 0.3, 0.5, 0.7, 1.0]
